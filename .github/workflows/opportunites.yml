
name: Opportunites commerciales Klineme

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Rechercher les opportunites
        env:
          DISCORD_WEBHOOK: ${{ secrets.WEBHOOK }}
        run: python opportunites.py

      - name: Enregistrer l'historique
        run: |
          if [ -f opportunites_seen.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add opportunites_seen.json
            if ! git diff --cached --quiet; then
              git commit -m "Mise a jour historique opportunites"
              git push
            fi
          fi
