name: Test Discord

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tester le webhook Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.WEBHOOK }}
        run: |
          python - <<'PY'
          import os
          import requests

          url = os.getenv("DISCORD_WEBHOOK", "").strip()

          if not url.startswith("https://discord.com/api/webhooks/"):
              raise SystemExit("ERREUR : URL absente ou format incorrect.")

          response = requests.post(
              url,
              json={"content": "Test Klineme : le webhook Discord fonctionne !"},
              timeout=15
          )

          if response.status_code == 204:
              print("SUCCES : message envoye sur Discord.")
          else:
              print(f"ECHEC : HTTP {response.status_code}")
              raise SystemExit(1)
          PY
